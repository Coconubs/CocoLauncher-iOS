name: Simulator smoke test

# Builds an iOS Simulator copy of the app (PLATFORM=7, same Makefile path as
# the upstream "iossimulator" build), starts it on a simulator and saves a
# screenshot, the launcher log and the files the Coco setup creates.
# It does not press Play: the game itself needs JIT and a Microsoft account
# that owns Minecraft, which a simulator run cannot provide.
# Report only: whether the app starts is written to the job summary and the
# artifact; it does not fail the run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: dev.coconubs.cocolauncher.ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid and GNU make
        run: brew install ldid make

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Rust for iOS (cocoram)
        run: rustup target add aarch64-apple-ios

      - name: Build for the iOS Simulator
        run: gmake -j"$(sysctl -n hw.ncpu)" payload PLATFORM=7 BOOTJDK="$JAVA_HOME/bin"

      - name: Re-sign for the Simulator (ad-hoc, no entitlements)
        continue-on-error: true
        run: |
          set -euo pipefail
          APP=artifacts/Payload/AngelAuraAmethyst.app
          # Simulator apps run as macOS processes; macOS refuses to start a
          # process whose signature carries iOS-only or private entitlements
          # (memorystatus, container-required, ...). The device IPA is not
          # affected by this step.
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign -f -s - --timestamp=none "$f" > /dev/null 2>&1 || echo "codesign failed: $f"
            fi
          done
          for fw in "$APP"/Frameworks/*.framework; do
            [ -d "$fw" ] && codesign -f -s - --timestamp=none "$fw" > /dev/null 2>&1 || true
          done
          codesign -f -s - --timestamp=none "$APP"
          codesign -dv --entitlements - "$APP" 2>&1 | head -n 20

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in devices[runtime]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted

      - name: Install and start CocoLauncher
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          mkdir -p out
          xcrun simctl install "$UDID" artifacts/Payload/AngelAuraAmethyst.app
          # Clean device, no Microsoft account: the home screen creates the Local account
          # "CocoTester" from this name, through the same path as a typed name.
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" cocoDemoName CocoTester
          # Account layer self-test LOCAL-01..06 (temporary empty home, not the player's data)
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" cocoSelfTest -bool YES
          xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1 | tee out/launch.txt
          sleep 60
          xcrun simctl io "$UDID" screenshot out/screen-60s.png
          sleep 30
          xcrun simctl io "$UDID" screenshot out/screen-90s.png
          (xcrun simctl spawn "$UDID" launchctl list | grep -i cocolauncher || echo "app process not found") | tee out/process.txt
          if grep -q "app process not found" out/process.txt; then
            RESULT="CocoLauncher is NOT running on the simulator after 90 s (see system-log.txt in the artifact)"
          else
            RESULT="CocoLauncher is running on the simulator after 90 s"
          fi
          echo "$RESULT" | tee out/result.txt
          echo "### Simulator smoke test: $RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Local account (first run, no Microsoft) and reload after restart
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          mkdir -p out
          DOCS="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents"
          EXPECTED="$(python3 -c 'import hashlib,uuid; h=bytearray(hashlib.md5(b"OfflinePlayer:CocoTester").digest()); h[6]=(h[6]&0x0f)|0x30; h[8]=(h[8]&0x3f)|0x80; print(uuid.UUID(bytes=bytes(h)))')"
          check() {
            F="$DOCS/accounts/CocoTester.json"
            if [ ! -f "$F" ]; then echo "FAIL ($1): $F missing"; ls -la "$DOCS/accounts" 2>&1; return 1; fi
            python3 - "$F" "$EXPECTED" "$1" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          ok = data.get("username") == "CocoTester" and data.get("profileId") == sys.argv[2] \
              and "xboxGamertag" not in data and not data.get("accessToken")
          print(("PASS" if ok else "FAIL") + " (%s): username=%s profileId=%s expected=%s msa_fields=%s" % (
              sys.argv[3], data.get("username"), data.get("profileId"), sys.argv[2],
              [k for k in ("xboxGamertag", "accessToken", "msaRefreshToken") if k in data]))
          sys.exit(0 if ok else 1)
          PY
          }
          R1="$(check 'first run')"; echo "$R1" | tee out/local-account.txt
          # Restart without the sample name: the saved account must still be there
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl spawn "$UDID" defaults delete "$BUNDLE_ID" cocoDemoName || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null 2>&1
          sleep 30
          xcrun simctl io "$UDID" screenshot out/screen-after-restart.png
          R2="$(check 'after restart')"; echo "$R2" | tee -a out/local-account.txt
          ls "$DOCS/accounts" | tee -a out/local-account.txt
          {
            echo "### Local account"
            echo "- $R1"
            echo "- $R2"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Account layer self-test (LOCAL-01..06)
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          mkdir -p out
          DOCS="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents"
          F="$DOCS/coco-selftest.json"
          if [ ! -f "$F" ]; then
            echo "### Account self-test: coco-selftest.json missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp "$F" out/
          python3 - "$F" <<'PY' | tee out/selftest.txt >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("### Account self-test")
          for key in sorted(data):
              r = data[key]
              print("- %s **%s** %s" % (key, "PASS" if r.get("pass") else "FAIL", r.get("detail", "")))
          PY

      - name: Collect logs and Coco files
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          mkdir -p out
          DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          echo "data container: $DATA"
          DOCS="$DATA/Documents"
          ls -la "$DOCS" > out/documents.txt 2>&1
          cp "$DOCS/latestlog.txt" out/ 2>/dev/null
          cp "$DOCS/coco-selftest.json" out/ 2>/dev/null
          find "$DOCS/instances" -maxdepth 4 > out/instances-tree.txt 2>&1
          cp "$DOCS/instances/default/launcher_profiles.json" out/ 2>/dev/null
          cp "$DOCS/instances/default/versions/fabric-loader-0.18.4-1.21.1/fabric-loader-0.18.4-1.21.1.json" out/ 2>/dev/null
          cp "$DOCS/launcher_preferences_v2.plist" out/ 2>/dev/null && plutil -convert xml1 out/launcher_preferences_v2.plist
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "AngelAuraAmethyst" OR eventMessage CONTAINS[c] "cocolauncher" OR eventMessage CONTAINS[c] "AngelAuraAmethyst"' > out/system-log.txt 2>&1
          echo "--- system log (tail)"; tail -n 60 out/system-log.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i -E "amethyst|coco" > out/crash-reports.txt
          for f in $(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i -E "amethyst|coco"); do cp "$HOME/Library/Logs/DiagnosticReports/$f" out/; done
          echo "--- latestlog.txt"; cat out/latestlog.txt
          echo "--- launcher_profiles.json"; cat out/launcher_profiles.json
          echo "--- instances"; cat out/instances-tree.txt
          echo "--- crash reports"; cat out/crash-reports.txt
          ls -la out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: out/
          retention-days: 30
