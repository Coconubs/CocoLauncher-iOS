name: Simulator smoke test

# Builds an iOS Simulator copy of the app (PLATFORM=7, same Makefile path as
# the upstream "iossimulator" build), starts it on a clean simulator with no
# Microsoft account, and checks:
#   - the account/installer self-tests (LOCAL-01..06, LOCAL-04b, INSTALL-01..04)
#   - a Local account pressing CHOI once: Java, Fabric, the Minecraft files and
#     the Coco pack are all prepared without Microsoft (LOCAL-06, LOCAL-07);
#     with cocoAutoPlay the app stops after the install instead of launching
#   - close/reopen and CHOI again: same Local account, nothing valid is
#     downloaded again (LOCAL-02, LOCAL-10)
# The game itself is not started (needs JIT and the Mojang files).
# Run by hand only (workflow_dispatch). Every verdict step fails the job when a
# check fails; only the setup steps are allowed to continue so that all
# verdicts and logs are still collected.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: dev.coconubs.cocolauncher.ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ldid and GNU make
        run: brew install ldid make

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Rust for iOS (cocoram)
        run: rustup target add aarch64-apple-ios

      - name: Build for the iOS Simulator
        run: gmake -j"$(sysctl -n hw.ncpu)" payload PLATFORM=7 BOOTJDK="$JAVA_HOME/bin"

      - name: Re-sign for the Simulator (ad-hoc, no entitlements)
        continue-on-error: true
        run: |
          set -euo pipefail
          APP=artifacts/Payload/AngelAuraAmethyst.app
          # Simulator apps run as macOS processes; macOS refuses to start a
          # process whose signature carries iOS-only or private entitlements
          # (memorystatus, container-required, ...). The device IPA is not
          # affected by this step.
          find "$APP" -type f | while read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign -f -s - --timestamp=none "$f" > /dev/null 2>&1 || echo "codesign failed: $f"
            fi
          done
          for fw in "$APP"/Frameworks/*.framework; do
            [ -d "$fw" ] && codesign -f -s - --timestamp=none "$fw" > /dev/null 2>&1 || true
          done
          codesign -f -s - --timestamp=none "$APP"
          codesign -dv --entitlements - "$APP" 2>&1 | head -n 20

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in devices[runtime]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted

      - name: Install and start CocoLauncher (clean device, no Microsoft account)
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          mkdir -p out
          xcrun simctl install "$UDID" artifacts/Payload/AngelAuraAmethyst.app
          # The home screen creates the Local account "CocoTester" from this name
          # (same path as a typed name), runs the self-tests and presses CHOI once.
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" cocoDemoName CocoTester
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" cocoSelfTest -bool YES
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" cocoAutoPlay -bool YES
          xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1 | tee out/launch.txt
          DOCS="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents"
          # Wait for the first installer run (Fabric + Coco pack download) to finish
          for i in $(seq 1 120); do
            [ -f "$DOCS/coco-install-report.json" ] && break
            sleep 10
          done
          xcrun simctl io "$UDID" screenshot out/screen-run1.png
          cp "$DOCS/coco-install-report.json" out/install-report-run1.json 2>/dev/null || echo "no install report after 20 min" | tee out/install-run1-missing.txt
          cp "$DOCS/coco-selftest.json" out/ 2>/dev/null || true

      - name: Verdict - self-tests
        if: always()
        run: set -o pipefail; python3 .github/scripts/coco_sim_checks.py selftest out/coco-selftest.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verdict - first Play (LOCAL-06, LOCAL-07)
        if: always()
        run: set -o pipefail; python3 .github/scripts/coco_sim_checks.py install1 out/install-report-run1.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Close and reopen, Play again
        if: always()
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -uo pipefail
          DOCS="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)/Documents"
          BEFORE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("finishedAt",0))' out/install-report-run1.json 2>/dev/null || echo 0)"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          # No sample name this time: the saved player name and account must be reused
          xcrun simctl spawn "$UDID" defaults delete "$BUNDLE_ID" cocoDemoName || true
          xcrun simctl spawn "$UDID" defaults write "$BUNDLE_ID" cocoSelfTest -bool NO
          xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null 2>&1
          for i in $(seq 1 120); do
            NOW="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("finishedAt",0))' "$DOCS/coco-install-report.json" 2>/dev/null || echo 0)"
            [ "$NOW" != "$BEFORE" ] && break
            sleep 5
          done
          xcrun simctl io "$UDID" screenshot out/screen-run2.png
          cp "$DOCS/coco-install-report.json" out/install-report-run2.json 2>/dev/null || true
          mkdir -p out/Documents && cp -R "$DOCS/accounts" out/Documents/ 2>/dev/null || true

      - name: Verdict - reopen (LOCAL-02 restart, LOCAL-10)
        if: always()
        run: set -o pipefail; python3 .github/scripts/coco_sim_checks.py install2 out/install-report-run1.json out/install-report-run2.json out/Documents | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect logs and Coco files
        if: always()
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          mkdir -p out
          DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          echo "data container: $DATA"
          DOCS="$DATA/Documents"
          ls -la "$DOCS" > out/documents.txt 2>&1
          cp "$DOCS/latestlog.txt" out/ 2>/dev/null
          cp "$DOCS/coco-selftest.json" out/ 2>/dev/null
          find "$DOCS/instances" -maxdepth 4 > out/instances-tree.txt 2>&1
          cp "$DOCS/instances/default/launcher_profiles.json" out/ 2>/dev/null
          cp "$DOCS/instances/default/versions/fabric-loader-0.18.4-1.21.1/fabric-loader-0.18.4-1.21.1.json" out/ 2>/dev/null
          cp "$DOCS/launcher_preferences_v2.plist" out/ 2>/dev/null && plutil -convert xml1 out/launcher_preferences_v2.plist
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "AngelAuraAmethyst" OR eventMessage CONTAINS[c] "cocolauncher" OR eventMessage CONTAINS[c] "AngelAuraAmethyst"' > out/system-log.txt 2>&1
          echo "--- system log (tail)"; tail -n 60 out/system-log.txt
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i -E "amethyst|coco" > out/crash-reports.txt
          for f in $(ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i -E "amethyst|coco"); do cp "$HOME/Library/Logs/DiagnosticReports/$f" out/; done
          echo "--- latestlog.txt"; cat out/latestlog.txt
          echo "--- launcher_profiles.json"; cat out/launcher_profiles.json
          echo "--- instances"; cat out/instances-tree.txt
          echo "--- crash reports"; cat out/crash-reports.txt
          ls -la out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: out/
          retention-days: 30
