<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm nguồn Coco</title>
<link rel="icon" href="icon-256.png">
<style>
:root { --bg: #f4f8fc; --text: #13202f; --muted: #5a6b7d; --accent: #2f7fd1; --accent-text: #fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1722; --text: #e8eef5; --muted: #9fb0c3; --accent: #5aa6ee; --accent-text: #0b1420; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 32px 16px; text-align: center; }
img { width: 88px; height: 88px; border-radius: 20px; }
a.btn { display: block; margin: 18px 0; padding: 13px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 600; text-decoration: none; }
p { color: var(--muted); }
code { word-break: break-all; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Thêm nguồn Coco vào SideStore</h1>
  <a class="btn" id="go" href="sidestore://source?url=https://coconubs.github.io/CocoLauncher-iOS/source.json">Mở SideStore</a>
  <p>Nếu SideStore không tự mở: vào SideStore › Sources › + › dán địa chỉ<br><code>https://coconubs.github.io/CocoLauncher-iOS/source.json</code></p>
  <p>Chưa có SideStore? Xem <a href="./">trang CocoLauncher</a>.</p>
</main>
<script>
setTimeout(function () { location.href = document.getElementById("go").href; }, 300);
</script>
</body>
</html>
